name: Actualizar lista TUMM TV+

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python generate_m3u.py
      - name: Commit si hubo cambios
        run: |
          git config user.name "tummtv-bot"
          git config user.email "tummtv-bot@users.noreply.github.com"
          git add tummtv.m3u
          git diff --cached --quiet || git commit -m "actualizar lista $(date -u +%F_%H:%M)"
          git push
      - name: Purgar caché jsDelivr
        run: |
          curl -s "https://purge.jsdelivr.net/gh/josueluz89/CANALES-BEBE@main/tummtv.m3u" || echo "purge falló"
